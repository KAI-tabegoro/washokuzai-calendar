<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和食材カレンダー｜Washokuzai Calendar</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="日本の魚介・野菜・果物の旬がひと目でわかるカレンダー。Washokuzai Calendar.">
<meta property="og:title" content="和食材カレンダー｜Washokuzai Calendar">
<meta property="og:description" content="日本の旬を、世界へ。">
<meta property="og:image" content="https://washokuzai-calendar.vercel.app/washokuzai-mark.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:url" content="https://washokuzai-calendar.vercel.app/">
<meta property="og:site_name" content="和食材カレンダー">
<meta property="og:locale" content="ja_JP">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://washokuzai-calendar.vercel.app/">
<meta property="og:type" content="website">
<style>
:root{
  --paper:#F2F4F3;
  --paper-2:#E9EDEB;
  --gold:#B08D53;
  --ink:#283D48;
  --ink-soft:#5F7278;
  --rule:#DCE2E0;
  --rule-strong:#C2CCC9;
  --now:#C8462F;
  --sea:#2C5871;      --sea-soft:#C8D8E1;
  --land:#556B33;     --land-soft:#D9E1CB;
  --fruit:#B0543E;    --fruit-soft:#EFD8CF;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--gothic);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto;padding:0 20px 72px}

/* ---------- hero ---------- */
.masthead{padding:36px 0 0;position:relative}
.langbar{position:absolute;top:34px;right:0}
.langbar select{
  font-family:inherit;font-size:12.5px;padding:5px 9px;cursor:pointer;
  border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);
}
.langbar select:focus{outline:2px solid var(--ink);outline-offset:1px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.masthead h1{
  font-family:var(--mincho);
  font-size:26px;font-weight:600;margin:0;letter-spacing:.06em;
}
.logo img{display:block;width:auto;height:74px;max-width:100%}
/* ロゴ画像が読み込めないときは文字のサイト名を出します */
.logo #siteTitle{display:none}
.logo.fallback img{display:none}
.logo.fallback #siteTitle{display:inline}
.masthead p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft)}

.now-panel{
  margin-top:26px;
  border-top:2px solid var(--ink);
  border-bottom:1px solid var(--rule-strong);
  padding:18px 0 20px;
}
.now-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.now-month{
  font-family:var(--mincho);
  font-size:44px;line-height:1;font-weight:600;
  color:var(--now);
}
.now-en{font-size:13px;color:var(--ink-soft)}
.now-count{font-size:13px;color:var(--ink-soft);margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chip{
  font-size:13px;padding:3px 9px;border-radius:2px;
  background:var(--paper-2);border:1px solid var(--rule-strong);
  cursor:pointer;
}
.chip:hover{border-color:var(--ink)}
.chip .en{color:var(--ink-soft);font-size:11px;margin-left:5px}
.chip.sea{border-left:3px solid var(--sea)}
.chip.land{border-left:3px solid var(--land)}
.chip.fruit{border-left:3px solid var(--fruit)}

/* ---------- controls ---------- */
.controls{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:18px 0;position:sticky;top:0;background:var(--paper);z-index:5;
  border-bottom:1px solid var(--rule);
}
.tabs{display:flex;gap:0;border:1px solid var(--rule-strong);border-radius:2px;overflow:hidden}
.tabs button{
  font-family:inherit;font-size:13px;padding:6px 13px;border:0;cursor:pointer;
  background:transparent;color:var(--ink-soft);border-right:1px solid var(--rule-strong);
}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
input[type="search"]{
  font-family:inherit;font-size:13px;padding:6px 10px;
  border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);
  width:200px;
}
input[type="search"]:focus{outline:2px solid var(--ink);outline-offset:1px}
.monthfilter{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.monthfilter button{
  font-family:inherit;font-size:12px;background:var(--now);color:#fff;
  border:0;border-radius:2px;padding:3px 8px;cursor:pointer;
}

/* ---------- grid ---------- */
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);padding:14px 0 6px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:11px;display:inline-block;border:1px solid var(--rule-strong)}

.months{
  display:grid;grid-template-columns:236px 1fr;gap:14px;align-items:end;
  position:sticky;top:63px;background:var(--paper);z-index:4;padding:8px 0 6px;
  border-bottom:1px solid var(--rule-strong);
}
.months .mrow{display:grid;grid-template-columns:repeat(12,1fr);gap:1px}
.months button{
  font-family:inherit;font-size:11px;padding:3px 0;text-align:center;cursor:pointer;
  background:transparent;border:0;color:var(--ink-soft);border-radius:2px;
}
.months button:hover{background:var(--paper-2);color:var(--ink)}
.months button.iscurrent{background:var(--now);color:#fff}
.months .label{font-size:11.5px;color:var(--ink-soft)}

.row{
  display:grid;grid-template-columns:52px 170px 1fr;gap:14px;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--rule);cursor:pointer;
}
.row:hover .name .ja{text-decoration:underline;text-underline-offset:2px}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.thumb{
  width:52px;height:40px;border:1px solid var(--rule-strong);border-radius:2px;
  overflow:hidden;background:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.thumb.none{
  font-size:8.5px;line-height:1.2;text-align:center;color:#9AA8AC;
  background:repeating-linear-gradient(45deg,var(--paper-2),var(--paper-2) 5px,#E2E7E5 5px,#E2E7E5 10px);
}
.name{min-width:0}
.name .ja{font-size:14px;display:block}
.name .en{font-size:11px;color:var(--ink-soft);display:block;line-height:1.35}
.band{display:grid;grid-template-columns:repeat(12,1fr);gap:1px}
.cell{height:20px;background:var(--paper-2);border-radius:1px}
.cell.lv1{background:var(--soft)}
.cell.lv2{background:var(--full)}
.cell.now{box-shadow:inset 0 0 0 1.5px rgba(200,70,47,.5)}
.row.sea{--full:var(--sea);--soft:var(--sea-soft)}
.row.land{--full:var(--land);--soft:var(--land-soft)}
.row.fruit{--full:var(--fruit);--soft:var(--fruit-soft)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:18px 0}
.tile{
  font-family:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;overflow:hidden;
  background:#fff;border:1px solid var(--rule-strong);border-radius:2px;
}
.tile:hover{border-color:var(--ink)}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tile .ph{aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.tile .ph.none{
  font-size:10px;color:#9AA8AC;
  background:repeating-linear-gradient(45deg,var(--paper-2),var(--paper-2) 6px,#E2E7E5 6px,#E2E7E5 12px);
}
.tile .meta{padding:8px 9px 10px;border-top:1px solid var(--rule)}
.tile .ja{font-size:13.5px;display:block}
.tile .en{font-size:10.5px;color:var(--ink-soft);display:block;line-height:1.35}
.tile .band{margin-top:8px}
.tile .cell{height:9px}
.tile.sea{--full:var(--sea);--soft:var(--sea-soft)}
.tile.land{--full:var(--land);--soft:var(--land-soft)}
.tile.fruit{--full:var(--fruit);--soft:var(--fruit-soft)}

/* ---------- detail ---------- */
.modal[hidden]{display:none}
.modal{
  position:fixed;inset:0;z-index:50;padding:20px;
  background:rgba(40,61,72,.74);display:flex;align-items:center;justify-content:center;
}
.modal-box{
  background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:2px;
}
.modal-photo{aspect-ratio:4/3;background:var(--paper-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.modal-photo img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.modal-photo.none{
  font-size:13px;color:#9AA8AC;letter-spacing:.1em;
  background:repeating-linear-gradient(45deg,var(--paper-2),var(--paper-2) 8px,#E2E7E5 8px,#E2E7E5 16px);
}
.modal-body{padding:18px 20px 22px}
.modal-body h2{font-family:var(--mincho);font-size:24px;font-weight:600;margin:0}
.modal-body .en{font-size:13px;color:var(--ink-soft);margin:2px 0 0}
.modal-body .peak{font-size:13px;margin:14px 0 0}
.modal-months{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;margin-top:14px}
.modal-months .cell{height:26px;border-radius:1px}
.modal-mlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;margin-top:4px;font-size:9.5px;color:var(--ink-soft);text-align:center}
/* 詳細（調理法・選び方・保存・豆知識） */
.sect{margin-top:24px;padding-top:18px;border-top:1px solid var(--rule)}
.sect h3{
  font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 12px;
  display:flex;align-items:center;gap:8px;
}
.sect h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.cooks{display:grid;gap:12px}
.cook{display:grid;grid-template-columns:84px 1fr;gap:13px;align-items:start}
.cook-ph{
  width:84px;aspect-ratio:4/3;border:1px solid var(--rule-strong);border-radius:2px;
  overflow:hidden;background:var(--paper-2);display:flex;align-items:center;justify-content:center;
}
.cook-ph img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.cook-ph.none{
  font-size:8px;color:#9AA8AC;text-align:center;line-height:1.2;
  background:repeating-linear-gradient(45deg,var(--paper-2),var(--paper-2) 5px,#E2E7E5 5px,#E2E7E5 10px);
}
.cook-txt .nm{font-size:14px;display:block;margin-bottom:2px}
.cook-txt .ds{font-size:12.5px;color:var(--ink-soft);line-height:1.65;display:block}
.notes{display:grid;gap:14px}
.note-item .lb{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:2px}
.note-item .tx{font-size:13.5px;line-height:1.7;display:block}
.origins{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.origin{font-size:12px;padding:2px 9px;border:1px solid var(--rule-strong);border-radius:2px;background:var(--paper-2)}
.trivia{font-size:13px;line-height:1.75;padding:12px 15px;background:var(--paper-2);border-left:3px solid var(--gold);border-radius:2px}

.modal-actions{display:flex;justify-content:flex-end;margin-top:24px}
.modal-actions button{
  font-family:inherit;font-size:13px;padding:6px 16px;cursor:pointer;
  background:var(--ink);color:var(--paper);border:0;border-radius:2px;
}
.modal-box.sea{--full:var(--sea);--soft:var(--sea-soft)}
.modal-box.land{--full:var(--land);--soft:var(--land-soft)}
.modal-box.fruit{--full:var(--fruit);--soft:var(--fruit-soft)}

.export{margin-left:auto;display:flex;gap:6px;align-items:center}
.export span{font-size:12px;color:var(--ink-soft)}
.export button{
  font-family:inherit;font-size:12px;padding:5px 11px;cursor:pointer;
  background:transparent;color:var(--ink);border:1px solid var(--rule-strong);border-radius:2px;
}
.export button:hover{border-color:var(--ink)}

.empty{padding:40px 0;color:var(--ink-soft);font-size:14px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-soft)}
footer p{margin:0 0 6px}
.site-info{
  display:grid;grid-template-columns:auto 1fr;gap:2px 14px;
  margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule);
}
.site-info dt{font-size:11px;color:var(--ink-soft)}
.site-info dd{margin:0;font-size:12.5px;color:var(--ink)}
.site-info a{color:var(--sea);text-decoration:none}
.site-info a:hover{text-decoration:underline}
.copyright{margin-top:14px;font-size:11px;color:var(--ink-soft)}

@media (max-width:640px){
  .wrap{padding:0 14px 56px}
  .now-month{font-size:36px}
  .logo img{height:52px}
  .langbar{top:0}
  .months{grid-template-columns:1fr;gap:4px;top:0;position:static;border-bottom:0}
  .months .label{display:none}
  .row{grid-template-columns:52px 1fr;gap:10px 12px;align-items:center;padding:10px 0}
  .row .band{grid-column:1 / -1}
  .cell{height:24px}
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile .cell{height:8px}
  .export{margin-left:0;width:100%}
  .modal{padding:0;align-items:flex-end}
  .cook{grid-template-columns:70px 1fr;gap:11px}
  .cook-ph{width:70px}
  .modal-box{max-width:none;max-height:92vh}
  .controls{position:static}
  input[type="search"]{width:100%}
}
@media (prefers-reduced-motion:no-preference){
  .chip,.tabs button{transition:background-color .12s ease,border-color .12s ease}
}
</style>
</head>

const NOW = new Date().getMonth(); // 0-11
let visible = [];

const $ = id => document.getElementById(id);
const LANG_KEY = "shunCalendarLang";

function pickLang(){
  const saved = localStorage.getItem(LANG_KEY);
  if (saved && UI[saved]) return saved;
  const nav = (navigator.language || "ja").toLowerCase();
  const hit = LANGS.find(l => nav.startsWith(l.code));
  return hit ? hit.code : "ja";
}
const state = {cat:"all", q:"", month:null, view:"list", lang:pickLang()};
const t = () => UI[state.lang];

/* 品目名を選択中の言語で返します。訳がなければ英語、それもなければ日本語。 */
function nameOf(it, lang){
  const l = lang || state.lang;
  return it[l] || it.en || it.ja;
}
/* 補助表示（選択中が日本語なら英語、それ以外なら日本語を添えます） */
function subNameOf(it){
  const sub = state.lang === "ja" ? (it.en || "") : (it.ja || "");
  return sub === nameOf(it) ? "" : sub;
}

/* ---- 画面文言の反映 ---- */
function applyLang(){
  const T = t();
  document.documentElement.lang = state.lang;
  document.title = T.title;
  $("siteTitle").textContent = T.title;
  $("siteSub").textContent = T.sub;
  $("itemColLabel").textContent = T.item;
  $("expPdf").textContent = T.print;
  $("clearMonth").textContent = T.clear;
  $("mClose").textContent = T.close;
  $("note1").textContent = T.note1;
  $("lblOperator").textContent = T.lblOperator;
  $("lblContact").textContent = T.lblContact;
  $("note2").textContent = T.note2;
  $("note2").hidden = !T.note2;

  const q = $("q");
  q.placeholder = T.search; q.setAttribute("aria-label", T.search);

  [...$("tabs").children].forEach(b => { b.textContent = T[b.dataset.cat]; });
  [...$("viewTabs").children].forEach(b => { b.textContent = T["view_" + b.dataset.view]; });

  $("legend").innerHTML =
    `<span><i class="sw" style="background:#2C5871"></i>${T.peak}</span>
     <span><i class="sw" style="background:#C8D8E1"></i>${T.avail}</span>
     <span><i class="sw" style="background:#556B33"></i>${T.land}</span>
     <span><i class="sw" style="background:#B0543E"></i>${T.fruit}</span>`;
}

function buildLangSelect(){
  const sel = $("lang");
  sel.innerHTML = LANGS.map(l =>
    `<option value="${l.code}"${l.code === state.lang ? " selected" : ""}>${l.label}</option>`).join("");
  sel.addEventListener("change", e => {
    state.lang = e.target.value;
    localStorage.setItem(LANG_KEY, state.lang);
    applyLang(); renderNow(); renderMonths(); render();
  });
}

/* ---- hero ---- */
function renderNow(){
  const T = t();
  $("nowMonthJa").textContent = T.monthsLong[NOW];
  $("nowMonthEn").textContent = state.lang === "ja" ? UI.en.monthsLong[NOW] : "";
  const peak = ITEMS.filter(it => it.m[NOW] === "2");
  $("nowCount").textContent = `${T.inSeason} ${T.count(peak.length)}`;
  const box = $("nowChips");
  box.innerHTML = "";
  peak.forEach(it => {
    const b = document.createElement("button");
    b.className = "chip " + it.cat;
    const sub = subNameOf(it);
    b.innerHTML = `${esc(nameOf(it))}${sub ? `<span class="en">${esc(sub)}</span>` : ""}`;
    b.addEventListener("click", () => { const v = nameOf(it); $("q").value = v; state.q = v; render(); });
    box.appendChild(b);
  });
}

/* ---- month header ---- */
function renderMonths(){
  const T = t();
  const row = $("monthRow");
  row.innerHTML = "";
  T.months.forEach((label, i) => {
    const b = document.createElement("button");
    b.textContent = window.innerWidth < 640 ? T.monthsShort[i] : label;
    b.title = T.monthsLong[i];
    if (i === NOW) b.classList.add("iscurrent");
    b.addEventListener("click", () => {
      state.month = (state.month === i) ? null : i;
      render();
    });
    row.appendChild(b);
  });
}

/* ---- list / tiles ---- */
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function photoHTML(it, cls){
  return it.img
    ? `<div class="${cls}"><img src="${esc(it.img)}" alt="${esc(nameOf(it))}" loading="lazy"
         onerror="this.parentNode.className='${cls} none';this.parentNode.textContent='NO PHOTO'"></div>`
    : `<div class="${cls} none">NO PHOTO</div>`;
}
function bandHTML(it, mark){
  const T = t();
  return [...it.m].map((v,i) =>
    `<div class="cell lv${v}${(mark && i===NOW)?" now":""}" title="${T.monthsLong[i]}"></div>`).join("");
}

function render(){
  const T = t();
  const q = state.q.trim().toLowerCase();
  const rows = ITEMS.filter(it => {
    if (state.cat !== "all" && it.cat !== state.cat) return false;
    if (state.month !== null && it.m[state.month] !== "2") return false;
    if (!q) return true;
    // 検索はすべての言語の名前とよみがなを対象にします
    return LANGS.some(l => (it[l.code] || "").toLowerCase().includes(q))
        || (it.kana || "").includes(q)
        || it.ja.toLowerCase().includes(q)
        || it.en.toLowerCase().includes(q);
  });
  visible = rows;

  const mf = $("monthFilter");
  if (state.month === null) { mf.hidden = true; }
  else {
    mf.hidden = false;
    $("monthFilterLabel").textContent = T.monthOf(T.months[state.month]);
  }
  $("monthHead").hidden = (state.view !== "list");

  const list = $("list");
  list.innerHTML = "";
  if (!rows.length){
    list.innerHTML = `<p class="empty">${esc(T.empty)}</p>`;
    return;
  }

  if (state.view === "tiles"){
    const grid = document.createElement("div");
    grid.className = "tiles";
    rows.forEach(it => {
      const t2 = document.createElement("button");
      t2.className = "tile " + it.cat;
      t2.dataset.i = ITEMS.indexOf(it);
      const sub = subNameOf(it);
      t2.innerHTML =
        `${photoHTML(it,"ph")}
         <div class="meta">
           <span class="ja">${esc(nameOf(it))}</span>
           <span class="en">${esc(sub)}</span>
           <div class="band">${bandHTML(it,false)}</div>
         </div>`;
      grid.appendChild(t2);
    });
    list.appendChild(grid);
    return;
  }

  const frag = document.createDocumentFragment();
  rows.forEach(it => {
    const r = document.createElement("div");
    r.className = "row " + it.cat;
    r.dataset.i = ITEMS.indexOf(it);
    r.tabIndex = 0;
    r.setAttribute("role","button");
    r.innerHTML =
      `${photoHTML(it,"thumb")}
       <div class="name"><span class="ja">${esc(nameOf(it))}</span><span class="en">${esc(subNameOf(it))}</span></div>
       <div class="band">${bandHTML(it,true)}</div>`;
    frag.appendChild(r);
  });
  list.appendChild(frag);
}

/* ---- detail ---- */
/* 詳細（調理法・選び方・保存・産地・豆知識）
   いずれも登録がなければ、その欄ごと表示されません。
   多言語対応：cook_en / pick_en のように「_言語コード」を付けた項目があればそちらが使われます。 */
function pickField(it, base){
  if (state.lang !== "ja"){
    const v = it[`${base}_${state.lang}`];
    if (v) return v;
    if (state.lang !== "en" && it[`${base}_en`]) return it[`${base}_en`];
  }
  return it[base] || "";
}
function cooksOf(it){
  const key = state.lang === "ja" ? "cooks" : `cooks_${state.lang}`;
  const list = it[key] || (state.lang !== "en" ? it.cooks_en : null) || it.cooks;
  return Array.isArray(list) ? list : [];
}
function detailHTML(it){
  const T = t();
  const out = [];

  const cooks = cooksOf(it);
  if (cooks.length){
    const items = cooks.map(c => {
      const ph = c.img
        ? `<div class="cook-ph"><img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy"
             onerror="this.parentNode.className='cook-ph none';this.parentNode.textContent='NO PHOTO'"></div>`
        : `<div class="cook-ph none">NO PHOTO</div>`;
      return `<div class="cook">${ph}<div class="cook-txt">
        <span class="nm">${esc(c.name)}</span>
        ${c.desc ? `<span class="ds">${esc(c.desc)}</span>` : ""}
      </div></div>`;
    }).join("");
    out.push(`<section class="sect"><h3>${T.secCook}</h3><div class="cooks">${items}</div></section>`);
  }

  const pick = pickField(it, "pick");
  const keep = pickField(it, "keep");
  if (pick || keep){
    const rows = [];
    if (pick) rows.push(`<div class="note-item"><span class="lb">${T.secPick}</span><span class="tx">${esc(pick)}</span></div>`);
    if (keep) rows.push(`<div class="note-item"><span class="lb">${T.secKeep}</span><span class="tx">${esc(keep)}</span></div>`);
    out.push(`<section class="sect"><div class="notes">${rows.join("")}</div></section>`);
  }

  const origins = it.origins || [];
  if (origins.length){
    out.push(`<section class="sect"><h3>${T.secOrigin}</h3><div class="origins">`
      + origins.map(o => `<span class="origin">${esc(o)}</span>`).join("") + `</div></section>`);
  }

  const trivia = pickField(it, "trivia");
  if (trivia){
    out.push(`<section class="sect"><h3>${T.secTrivia}</h3><p class="trivia">${esc(trivia)}</p></section>`);
  }
  return out.join("");
}

function openDetail(i){
  const it = ITEMS[i];
  if (!it) return;
  const T = t();
  $("modalBox").className = "modal-box " + it.cat;
  $("mPhotoWrap").innerHTML = photoHTML(it,"modal-photo");
  $("mTitle").textContent = nameOf(it);
  $("mEn").textContent = subNameOf(it);
  const peak = [...it.m].map((v,n) => v === "2" ? T.months[n] : null).filter(Boolean);
  $("mPeak").textContent = peak.length ? T.peakLabel(peak) : T.noPeak;
  $("mMonths").innerHTML = bandHTML(it,true);
  $("mLabels").innerHTML = T.monthsShort.map(m => `<div>${m}</div>`).join("");
  $("mDetail").innerHTML = detailHTML(it);
  $("modal").hidden = false;
  $("mClose").focus();
}
function closeDetail(){ $("modal").hidden = true; }

/* ---- 印刷・PDF ----
   いま表示している品目を、別ウィンドウで印刷用に組み直します。
   印刷ダイアログで「PDFに保存」を選べば PDF になります。 */
function exportPdf(){
  const T = t();
  if (!visible.length) return;

  const cond = [];
  if (state.cat !== "all") cond.push(`${T.printCat}：${T[state.cat]}`);
  if (state.month !== null) cond.push(`${T.printMonth}：${T.months[state.month]}`);
  if (state.q.trim()) cond.push(`${T.printSearch}：${state.q.trim()}`);
  const condText = cond.length ? cond.join("　/　") : T.printAll;

  const d = new Date().toLocaleDateString(state.lang === "ja" ? "ja-JP" : "en-GB",
    {year:"numeric", month:"long", day:"numeric"});

  const rows = visible.map(it => {
    const sub = subNameOf(it);
    const cells = [...it.m].map(v =>
      `<td class="m lv${v}">${v === "2" ? "■" : (v === "1" ? "□" : "")}</td>`).join("");
    return `<tr class="${it.cat}">
      <td class="nm"><b>${esc(nameOf(it))}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</td>
      ${cells}</tr>`;
  }).join("");

  const head = T.months.map(m => `<th>${esc(m)}</th>`).join("");

  const w = window.open("", "_blank");
  if (!w){ alert(state.lang === "ja"
    ? "印刷用の画面を開けませんでした。ブラウザのポップアップ設定をご確認ください。"
    : "Could not open the print view. Please allow pop-ups for this site."); return; }

  w.document.write(`<!DOCTYPE html><html lang="${state.lang}"><head><meta charset="utf-8">
<title>${esc(T.printTitle)}</title>
<style>
  @page{size:A4 portrait;margin:14mm 12mm}
  *{box-sizing:border-box}
  body{margin:0;color:#283D48;font-size:9.5pt;line-height:1.5;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",sans-serif}
  header{border-bottom:2px solid #283D48;padding-bottom:7px;margin-bottom:4px}
  h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:16pt;font-weight:600;margin:0;letter-spacing:.04em}
  .sub{font-size:8pt;color:#5F7278;margin-top:2px}
  .cond{display:flex;justify-content:space-between;gap:12px;font-size:8pt;color:#5F7278;
    padding:5px 0 9px;flex-wrap:wrap}
  table{border-collapse:collapse;width:100%}
  thead{display:table-header-group}
  th,td{border:.5pt solid #C2CCC9;padding:2.6pt 3pt}
  th{background:#EDF0EF;font-size:7.5pt;font-weight:600;color:#5F7278;text-align:center}
  th:first-child{text-align:left;width:31%}
  td.nm b{font-weight:600;font-size:9.5pt}
  td.nm span{display:block;font-size:7pt;color:#5F7278;line-height:1.25}
  td.m{text-align:center;width:5.75%;font-size:7pt;line-height:1}
  tr.sea td.m.lv2{background:#2C5871;color:#2C5871}
  tr.sea td.m.lv1{background:#C8D8E1;color:#C8D8E1}
  tr.land td.m.lv2{background:#556B33;color:#556B33}
  tr.land td.m.lv1{background:#D9E1CB;color:#D9E1CB}
  tr.fruit td.m.lv2{background:#B0543E;color:#B0543E}
  tr.fruit td.m.lv1{background:#EFD8CF;color:#EFD8CF}
  tr{break-inside:avoid}
  footer{margin-top:9px;padding-top:6px;border-top:.5pt solid #DCE2E0;font-size:7.5pt;color:#5F7278}
</style></head><body>
<header>
  <h1>${esc(T.printTitle)}</h1>
  <div class="sub">${esc(T.printSub)}</div>
</header>
<div class="cond">
  <span>${esc(T.printFilter)}：${esc(condText)}　/　${esc(T.printCount(visible.length))}</span>
  <span>${esc(T.printLegend)}　/　${esc(T.printDate(d))}</span>
</div>
<table><thead><tr><th>${esc(T.item)}</th>${head}</tr></thead><tbody>${rows}</tbody></table>
<footer>${esc(T.printNote)}<br>${esc(T.lblOperator)}：KAI　/　&copy; 2026 ${esc(T.printTitle)}</footer>
</body></html>`);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 400);
}

/* ---- events ---- */
$("tabs").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  state.cat = btn.dataset.cat;
  [...$("tabs").children].forEach(b => b.setAttribute("aria-pressed", b === btn));
  render();
});
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("clearMonth").addEventListener("click", () => { state.month = null; render(); });

$("viewTabs").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  state.view = btn.dataset.view;
  [...$("viewTabs").children].forEach(b => b.setAttribute("aria-pressed", b === btn));
  render();
});

$("list").addEventListener("click", e => {
  const el = e.target.closest("[data-i]");
  if (el) openDetail(Number(el.dataset.i));
});
$("list").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest(".row[data-i]");
  if (el){ e.preventDefault(); openDetail(Number(el.dataset.i)); }
});
$("mClose").addEventListener("click", closeDetail);
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeDetail(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("modal").hidden) closeDetail(); });

$("expPdf").addEventListener("click", exportPdf);

window.addEventListener("resize", renderMonths);

buildLangSelect();
applyLang();
renderNow();
renderMonths();
render();
</script>
</body>
</html>
