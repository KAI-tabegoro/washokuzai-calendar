<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>産地から探す｜和食材カレンダー / Find by region</title>
<meta name="description" content="都道府県から、その土地の旬の食材を探せます。Find Japanese ingredients in season by prefecture.">
<link rel="canonical" href="https://washokuzai-calendar.com/region.html">
<link rel="icon" href="favicon.png">
<style>
:root{
  --paper:#F2F4F3;
  --paper-2:#E9EDEB;
  --gold:#B08D53;
  --ink:#283D48;
  --ink-soft:#5F7278;
  --rule:#DCE2E0;
  --rule-strong:#C2CCC9;
  --now:#C8462F;
  --sea:#2C5871;      --sea-soft:#C8D8E1;
  --land:#556B33;     --land-soft:#D9E1CB;
  --fruit:#B0543E;    --fruit-soft:#EFD8CF;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Noto Sans Thai","Leelawadee UI","Thonburi","PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei","Noto Sans TC","Noto Sans SC","Meiryo",system-ui,sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif Thai","Thonburi","Noto Serif TC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);
  font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:32px 22px 80px}
header{border-bottom:1px solid var(--rule-strong);padding-bottom:18px;margin-bottom:22px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.home img{width:34px;height:34px;border-radius:50%;display:block}
.home span{font-family:var(--mincho);font-size:17px;font-weight:600}

.ptabs{display:flex;flex-wrap:wrap;gap:5px}
.ptab{font-family:inherit;font-size:12px;padding:5px 11px;cursor:pointer;
  background:transparent;color:var(--ink-soft);border:1px solid var(--rule-strong);border-radius:2px}
.ptab:hover{border-color:var(--ink)}
.ptab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

h2{font-family:var(--mincho);font-size:24px;font-weight:600;margin:0 0 8px}
.lead{color:var(--ink-soft);margin:0 0 26px;font-size:14px}

/* 都道府県 */
.reg{margin:0 0 18px}
.reg h3{font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 8px;
  letter-spacing:.06em}
.prefs{display:flex;flex-wrap:wrap;gap:6px}
.pref{font-family:inherit;font-size:13px;padding:6px 12px;cursor:pointer;
  background:var(--paper);color:var(--ink);border:1px solid var(--rule-strong);border-radius:2px;
  display:inline-flex;align-items:baseline;gap:6px}
.pref:hover{border-color:var(--ink)}
.pref.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pref b{font-weight:400}
.pref i{font-style:normal;font-size:11px;opacity:.6}

/* 結果 */
.result{margin-top:30px;border-top:1px solid var(--rule-strong);padding-top:22px}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:16px}
.rtitle{font-family:var(--mincho);font-size:21px;font-weight:600;margin:0}
.rcount{font-size:13px;color:var(--ink-soft)}
.months{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px}
.mon{font-family:inherit;font-size:11.5px;padding:4px 9px;cursor:pointer;
  background:transparent;color:var(--ink-soft);border:1px solid var(--rule);border-radius:2px}
.mon:hover{border-color:var(--ink);color:var(--ink)}
.mon.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.card{border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:#fff;
  text-decoration:none;color:inherit;display:block}
.card:hover{border-color:var(--ink-soft)}
.card .ph{aspect-ratio:4/3;background:#e8e3d9}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .tx{padding:9px 11px 11px}
.card .nm{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:3px}
.card .mt{font-size:11.5px;color:var(--ink-soft)}
.card .ct{font-size:10.5px;color:var(--ink-soft);margin-top:4px}
.empty{color:var(--ink-soft);font-size:14px;padding:20px 0}
.note{font-size:12px;color:var(--ink-soft);margin-top:26px;padding-top:14px;
  border-top:1px solid var(--rule)}

footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--ink-soft)}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule-strong)}
html[lang="th"] body{line-height:2}
@media (max-width:560px){
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .pref{font-size:12px;padding:5px 10px}
}

/* REGIONCIRCLE-CSS-START 都道府県を丸い写真にする */
.reg{margin:0 0 26px}
.reg h3{margin:0 0 11px}
.prefs{display:flex;flex-wrap:wrap;gap:16px 15px}
.pref{flex:0 0 84px;width:84px;display:block;padding:0;border:0;background:none;
      text-align:center;font-family:inherit;cursor:pointer}
.pref .ph{display:block;position:relative;width:100%;aspect-ratio:1/1;border-radius:50%;
          overflow:hidden;background:var(--paper-2)}
.pref .ph img{width:100%;height:100%;object-fit:cover;display:block}
/* 名前は写真の下に、はっきり読めるように置く */
.pref .nm{display:block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ink);
          line-height:1.35;letter-spacing:.02em}
.pref i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-soft);margin-top:1px}
.pref:hover{border:0}
.pref:hover .ph{filter:brightness(1.06)}
.pref:hover .nm{color:var(--gold)}
.pref.on{background:none;color:inherit;border:0}
.pref.on .ph{outline:2px solid var(--now);outline-offset:2px}
.pref.on .nm{color:var(--now)}
@media (max-width:520px){
  .prefs{gap:14px 11px} .pref{flex:0 0 72px;width:72px}
  .pref .nm{font-size:11.5px;margin-top:6px}
}
/* REGIONCIRCLE-CSS-END */
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="./">
      <img src="washokuzai-mark.png" alt="" width="34" height="34">
      <span>和食材カレンダー</span>
    </a>
    <nav class="ptabs"><button class="ptab on" data-lang="ja">日本語</button>
<button class="ptab" data-lang="en">English</button>
<button class="ptab" data-lang="th">ไทย</button>
<button class="ptab" data-lang="zh">繁體中文</button>
<button class="ptab" data-lang="zh-CN">简体中文</button></nav>
  </header>

  <h2 id="ttl"></h2>
  <p class="lead" id="lead"></p>

  <div id="regions"></div>

  <section class="result" id="result" hidden>
    <div class="rhead">
      <h3 class="rtitle" id="rtitle"></h3>
      <span class="rcount" id="rcount"></span>
    </div>
    <div class="months" id="months"></div>
    <div class="cards" id="cards"></div>
    <p class="empty" id="empty" hidden></p>
    <p class="note" id="note"></p>
  </section>

  <footer>
    <p><a href="./" id="backLink">&larr; サイトへ戻る</a></p>
    <p>&copy; 2026 和食材カレンダー / Washokuzai Calendar</p>
  </footer>
</div>

<script>
const T = {"ja": {"name": "日本語", "title": "産地から探す", "lead": "都道府県を選ぶと、その土地の旬の食材が表示されます。", "region": {"hokkaido": "北海道", "tohoku": "東北", "kanto": "関東", "chubu": "中部", "kinki": "近畿", "chugoku": "中国", "shikoku": "四国", "kyushu": "九州・沖縄"}, "allMonth": "通年", "pick": "選んでください", "count": "{n}品目", "monthAll": "すべての月", "mon": ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"], "peak": "旬", "cat": {"sea": "魚介", "land": "野菜", "fruit": "果物"}, "none": "該当する食材がありません。", "back": "サイトへ戻る", "note": "主な産地として登録しているものを表示しています。実際にはこのほかの産地でも獲れます。"}, "en": {"name": "English", "title": "Find by region", "lead": "Choose a prefecture to see what is in season there.", "region": {"hokkaido": "Hokkaido", "tohoku": "Tohoku", "kanto": "Kanto", "chubu": "Chubu", "kinki": "Kinki", "chugoku": "Chugoku", "shikoku": "Shikoku", "kyushu": "Kyushu and Okinawa"}, "allMonth": "All year", "pick": "Please choose", "count": "{n} items", "monthAll": "All months", "mon": ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], "peak": "In season", "cat": {"sea": "Seafood", "land": "Vegetables", "fruit": "Fruit"}, "none": "Nothing found.", "back": "Back to the site", "note": "These are the main growing and fishing areas on record. Other areas produce them too."}, "th": {"name": "ไทย", "title": "ค้นหาจากแหล่งผลิต", "lead": "เลือกจังหวัดเพื่อดูว่าที่นั่นมีอะไรอยู่ในฤดูกาล", "region": {"hokkaido": "ฮอกไกโด", "tohoku": "โทโฮกุ", "kanto": "คันโต", "chubu": "ชูบุ", "kinki": "คันไซ", "chugoku": "ชูโงกุ", "shikoku": "ชิโกกุ", "kyushu": "คิวชูและโอกินาวะ"}, "allMonth": "ตลอดปี", "pick": "กรุณาเลือก", "count": "{n} รายการ", "monthAll": "ทุกเดือน", "mon": ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."], "peak": "ช่วงอร่อยที่สุด", "cat": {"sea": "อาหารทะเล", "land": "ผัก", "fruit": "ผลไม้"}, "none": "ไม่พบรายการ", "back": "กลับไปที่เว็บไซต์", "note": "แสดงเฉพาะแหล่งผลิตหลักที่บันทึกไว้ ในความเป็นจริงยังมีแหล่งอื่นอีก"}, "zh": {"name": "繁體中文", "title": "從產地尋找", "lead": "選擇都道府縣，就能看到當地的當令食材。", "region": {"hokkaido": "北海道", "tohoku": "東北", "kanto": "關東", "chubu": "中部", "kinki": "近畿", "chugoku": "中國地方", "shikoku": "四國", "kyushu": "九州・沖繩"}, "allMonth": "全年", "pick": "請選擇", "count": "{n} 項", "monthAll": "所有月份", "mon": ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"], "peak": "當令", "cat": {"sea": "海鮮", "land": "蔬菜", "fruit": "水果"}, "none": "沒有符合的食材。", "back": "返回網站", "note": "這裡顯示的是登錄為主要產地的資料，實際上其他產地也有出產。"}, "zh-CN": {"name": "简体中文", "title": "从产地寻找", "lead": "选择都道府县，就能看到当地的应季食材。", "region": {"hokkaido": "北海道", "tohoku": "东北", "kanto": "关东", "chubu": "中部", "kinki": "近畿", "chugoku": "中国地方", "shikoku": "四国", "kyushu": "九州・冲绳"}, "allMonth": "全年", "pick": "请选择", "count": "{n} 项", "monthAll": "所有月份", "mon": ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"], "peak": "应季", "cat": {"sea": "海鲜", "land": "蔬菜", "fruit": "水果"}, "none": "没有符合的食材。", "back": "返回网站", "note": "这里显示的是登录为主要产地的数据，实际上其他产地也有出产。"}};
const REGIONS = [["hokkaido", ["北海道"]], ["tohoku", ["青森", "岩手", "宮城", "秋田", "山形", "福島"]], ["kanto", ["茨城", "栃木", "群馬", "埼玉", "千葉", "東京", "神奈川"]], ["chubu", ["新潟", "富山", "石川", "福井", "山梨", "長野", "岐阜", "静岡", "愛知"]], ["kinki", ["三重", "滋賀", "京都", "大阪", "兵庫", "奈良", "和歌山"]], ["chugoku", ["鳥取", "島根", "岡山", "広島", "山口"]], ["shikoku", ["徳島", "香川", "愛媛", "高知"]], ["kyushu", ["福岡", "佐賀", "長崎", "熊本", "大分", "宮崎", "鹿児島", "沖縄"]]];
const PREF_IMG = {"北海道":"images/pref/hokkaido.jpg","青森":"images/pref/aomori.jpg","岩手":"images/pref/iwate.jpg","宮城":"images/pref/miyagi.jpg","秋田":"images/pref/akita.jpg","山形":"images/pref/yamagata.jpg","福島":"images/pref/fukushima.jpg","茨城":"images/pref/ibaraki.jpg","栃木":"images/pref/tochigi.jpg","群馬":"images/pref/gunma.jpg","埼玉":"images/pref/saitama.jpg","千葉":"images/pref/chiba.jpg","東京":"images/pref/tokyo.jpg","神奈川":"images/pref/kanagawa.jpg","新潟":"images/pref/niigata.jpg","富山":"images/pref/toyama.jpg","石川":"images/pref/ishikawa.jpg","福井":"images/pref/fukui.jpg","山梨":"images/pref/yamanashi.jpg","長野":"images/pref/nagano.jpg","岐阜":"images/pref/gifu.jpg","静岡":"images/pref/shizuoka.jpg","愛知":"images/pref/aichi.jpg","三重":"images/pref/mie.jpg","滋賀":"images/pref/shiga.jpg","京都":"images/pref/kyoto.jpg","大阪":"images/pref/osaka.jpg","兵庫":"images/pref/hyogo.jpg","奈良":"images/pref/nara.jpg","和歌山":"images/pref/wakayama.jpg","鳥取":"images/pref/tottori.jpg","島根":"images/pref/shimane.jpg","岡山":"images/pref/okayama.jpg","広島":"images/pref/hiroshima.jpg","山口":"images/pref/yamaguchi.jpg","徳島":"images/pref/tokushima.jpg","香川":"images/pref/kagawa.jpg","愛媛":"images/pref/ehime.jpg","高知":"images/pref/kochi.jpg","福岡":"images/pref/fukuoka.jpg","佐賀":"images/pref/saga.jpg","長崎":"images/pref/nagasaki.jpg","熊本":"images/pref/kumamoto.jpg","大分":"images/pref/oita.jpg","宮崎":"images/pref/miyazaki.jpg","鹿児島":"images/pref/kagoshima.jpg","沖縄":"images/pref/okinawa.jpg"};
const LANGS = ["ja", "en", "th", "zh", "zh-CN"];

let lang = "ja";
let common = null;
const text = {};          // 言語ごとの品目データ
let pref = null;            // 選んでいる県（日本語表記）
let month = null;           // 選んでいる月（0始まり）

const $ = id => document.getElementById(id);

async function load(L){
  if (!common){
    const r = await fetch("data/common.json", {cache:"no-cache"});
    common = await r.json();
  }
  if (!text[L]){
    const r = await fetch(`data/${L}.json`, {cache:"no-cache"});
    const a = await r.json();
    text[L] = Object.fromEntries(a.map(d => [d.id, d]));
  }
  if (!text.ja){
    const r = await fetch("data/ja.json", {cache:"no-cache"});
    const a = await r.json();
    text.ja = Object.fromEntries(a.map(d => [d.id, d]));
  }
}

/* 日本語の県名 → その言語の県名。品目データの origins が同じ並びなので対応が取れる。 */
function prefName(jp, L){
  if (L === "ja") return jp;
  for (const c of common){
    const j = text.ja[c.id], t = text[L][c.id];
    if (!j || !t || !j.origins || !t.origins) continue;
    const i = j.origins.indexOf(jp);
    if (i >= 0 && t.origins[i]) return t.origins[i];
  }
  return jp;
}

function itemsOf(jp){
  return common.filter(c => {
    const j = text.ja[c.id];
    return j && j.origins && j.origins.includes(jp);
  });
}

function peakText(m, L){
  const mon = T[L].mon;
  let on = [];
  for (let i = 0; i < 12; i++) if (m[i] === "2") on.push(i);
  if (!on.length){
    /* 旬の指定が無い品目は、出回る期間を見る */
    for (let i = 0; i < 12; i++) if (m[i] !== "0") on.push(i);
    if (!on.length) return "";
  }
  if (on.length === 12) return T[L].allMonth;
  /* 続いている区間にまとめる。12月→1月の繋がりも見る。 */
  const runs = [];
  let s = on[0], p = on[0];
  for (let k = 1; k < on.length; k++){
    if (on[k] === p + 1){ p = on[k]; continue; }
    runs.push([s, p]); s = on[k]; p = on[k];
  }
  runs.push([s, p]);
  if (runs.length > 1 && runs[0][0] === 0 && runs[runs.length-1][1] === 11){
    const last = runs.pop();
    runs[0] = [last[0], runs[0][1]];
  }
  return runs.map(([a, b]) => a === b ? mon[a] : `${mon[a]}–${mon[b]}`).join("  ");
}

function drawRegions(){
  const L = lang, box = $("regions");
  box.innerHTML = "";
  for (const [key, list] of REGIONS){
    const sec = document.createElement("div");
    sec.className = "reg";
    const h = document.createElement("h3");
    h.textContent = T[L].region[key];
    const row = document.createElement("div");
    row.className = "prefs";
    for (const jp of list){
      const n = itemsOf(jp).length;
      const b = document.createElement("button");
      b.className = "pref" + (pref === jp ? " on" : "");
      b.type = "button";
      b.dataset.pref = jp;
      /* REGIONCIRCLE-JS-START */
      const src = PREF_IMG[jp];
      b.innerHTML = `<span class="ph">`
        + (src ? `<img src="${src}" alt="" width="200" height="200" loading="lazy" decoding="async">` : ``)
        + `</span><span class="nm">${prefName(jp, L)}</span>`
        + `<i>${n}</i>`;
      /* REGIONCIRCLE-JS-END */
      row.appendChild(b);
    }
    sec.append(h, row);
    box.appendChild(sec);
  }
}

function drawResult(){
  const L = lang;
  if (!pref){ $("result").hidden = true; return; }
  $("result").hidden = false;
  $("rtitle").textContent = prefName(pref, L);
  $("note").textContent = T[L].note;

  /* 月の絞り込み */
  const mbox = $("months");
  mbox.innerHTML = "";
  const all = document.createElement("button");
  all.className = "mon" + (month === null ? " on" : "");
  all.type = "button"; all.dataset.m = "";
  all.textContent = T[L].monthAll;
  mbox.appendChild(all);
  T[L].mon.forEach((nm, i) => {
    const b = document.createElement("button");
    b.className = "mon" + (month === i ? " on" : "");
    b.type = "button"; b.dataset.m = String(i);
    b.textContent = nm;
    mbox.appendChild(b);
  });

  let list = itemsOf(pref);
  if (month !== null) list = list.filter(c => c.m[month] === "2");

  $("rcount").textContent = T[L].count.replace("{n}", list.length);

  const cards = $("cards");
  cards.innerHTML = "";
  $("empty").hidden = list.length > 0;
  $("empty").textContent = T[L].none;

  for (const c of list){
    const d = text[L][c.id] || text.ja[c.id];
    const a = document.createElement("a");
    a.className = "card";
    a.href = "./?lang=" + L;
    a.innerHTML =
      `<div class="ph">${c.img ? `<img src="${c.img}" alt="" loading="lazy">` : ""}</div>` +
      `<div class="tx">` +
        `<div class="nm">${d.name || c.id}</div>` +
        `<div class="mt">${peakText(c.m, L)}</div>` +
        `<div class="ct">${T[L].cat[c.cat]}</div>` +
      `</div>`;
    cards.appendChild(a);
  }
}

async function pick(L){
  lang = L;
  await load(L);
  document.querySelectorAll(".ptab").forEach(x => x.classList.toggle("on", x.dataset.lang === L));
  document.documentElement.lang = L;
  $("ttl").textContent = T[L].title;
  $("lead").textContent = T[L].lead;
  $("backLink").textContent = "\u2190 " + T[L].back;
  document.title = T[L].title + "｜和食材カレンダー";
  drawRegions();
  drawResult();
}

document.querySelector(".ptabs").addEventListener("click", e => {
  const b = e.target.closest(".ptab");
  if (b) pick(b.dataset.lang);
});

$("regions").addEventListener("click", e => {
  const b = e.target.closest(".pref");
  if (!b) return;
  pref = (pref === b.dataset.pref) ? null : b.dataset.pref;
  month = null;
  drawRegions();
  drawResult();
  if (pref) $("result").scrollIntoView({behavior:"smooth", block:"start"});
});

$("months").addEventListener("click", e => {
  const b = e.target.closest(".mon");
  if (!b) return;
  month = b.dataset.m === "" ? null : Number(b.dataset.m);
  drawResult();
});

/* 起動 */
(async () => {
  const q = new URLSearchParams(location.search);
  const L = q.get("lang");
  const nav = (navigator.language || "").toLowerCase();
  const guess = (L && LANGS.includes(L)) ? L
    : nav.startsWith("ja") ? "ja"
    : nav.startsWith("th") ? "th"
    : (nav.startsWith("zh-cn") || nav.startsWith("zh-hans")) ? "zh-CN"
    : nav.startsWith("zh") ? "zh"
    : "en";
  const p = q.get("pref");
  if (p) pref = p;
  await pick(guess);
})();
</script>
